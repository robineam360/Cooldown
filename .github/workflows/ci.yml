# CCRM-91 (CI Gate): both flavors' unit tests, both release builds and lint, on every push
# to main and every pull request. No secrets: CI never signs, so the release outputs are
# unsigned (app/build.gradle.kts leaves them so without keystore.properties). Release
# signing stays on the Mac, per RELEASING.md; Step 8 of RUNBOOK.md gates a release on this
# workflow being green for the exact release commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # CCRM-92 (Shared Spec): spec/ (core and mobile layer) is Markdown and JSON only.
      - name: Shared spec holds no code
        run: sh spec/tools/check_no_code.sh

      # JDK 21, not 17: Robolectric's SDK 36 sandbox refuses to start on Java 17. The code
      # still compiles to Java 17 bytecode (compileOptions). The Mac gets 21 the same way
      # through org.gradle.java.home in ~/.gradle/gradle.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, both flavors
        run: ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest

      - name: Release builds, unsigned
        run: ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease

      - name: Lint, both flavors
        run: ./gradlew --no-daemon lintGithubDebug lintPlayDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  # CCRM-94 (iOS App): the iPhone/iPad app's pure core, tested against the shared spec
  # (spec/core/fixtures). No signing, no simulator — `swift test` on the Mac runner.
  ios-core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: CooldownCore tests against spec/core/fixtures
        run: swift test --package-path ios/Packages/CooldownCore

  # CCRM-94 (iOS App): the app itself — XcodeGen project, a simulator build of the app and its widget extension, and
  # the app-hosted tests (Keychain store, card wording, card layout, every widget/lock-screen/Live Activity face
  # rendered). Simulator only: no signing identity or team on the runner.
  ios-app:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          phones=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(phones[-1]["udid"] if phones else "")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          test -n "$UDID"

      - name: Build and run the app tests
        run: |
          xcodebuild test -project ios/Cooldown.xcodeproj -scheme Cooldown \
            -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:CooldownTests \
            -derivedDataPath ios/.derived | tail -40
          test ${PIPESTATUS[0]} -eq 0
