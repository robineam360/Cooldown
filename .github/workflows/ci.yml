# CCRM-91 (CI Gate): both flavors' unit tests, both release builds and lint, on every push
# to main and every pull request. No secrets: CI never signs, so the release outputs are
# unsigned (app/build.gradle.kts leaves them so without keystore.properties). Release
# signing stays on the Mac, per RELEASING.md; Step 8 of RUNBOOK.md gates a release on this
# workflow being green for the exact release commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # JDK 21, not 17: Robolectric's SDK 36 sandbox refuses to start on Java 17. The code
      # still compiles to Java 17 bytecode (compileOptions). The Mac gets 21 the same way
      # through org.gradle.java.home in ~/.gradle/gradle.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, both flavors
        run: ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest

      - name: Release builds, unsigned
        run: ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease

      - name: Lint, both flavors
        run: ./gradlew --no-daemon lintGithubDebug lintPlayDebug

      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
