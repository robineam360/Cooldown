# CCRM-93 (iOS Spike): a bare app + widget extension that proves the free-personal-team facts on the
# iPad before any feature work (docs/ios/PLAN.md step 2). project.yml is the source of truth; the
# generated Cooldown.xcodeproj is gitignored. The team id is passed on the command line
# (DEVELOPMENT_TEAM=...), never committed.
name: Cooldown
options:
  bundleIdPrefix: com.robinrichardrajan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  # CCRM-94 (iOS App): the pure core, tested on the Mac against spec/core/fixtures.
  CooldownCore:
    path: Packages/CooldownCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cooldown:
    type: application
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Keychain:
          enabled: 1
    platform: iOS
    sources: [App, Spike/Shared]
    dependencies:
      - target: CooldownWidgets
      - package: CooldownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrichardrajan.cooldown
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # The launcher icon (the approved Pulse tile, CCRM-60 (Dual Identity)) arrives with the release piece.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cooldown
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: App/Cooldown.entitlements
      properties:
        com.apple.security.application-groups: [group.com.robinrichardrajan.cooldown]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.robinrichardrajan.cooldown.shared"]
  CooldownWidgets:
    type: app-extension
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Keychain:
          enabled: 1
    platform: iOS
    sources: [Spike/Widget, Spike/Shared]
    dependencies:
      - package: CooldownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrichardrajan.cooldown.widgets
    info:
      path: Spike/Widget/Info.plist
      properties:
        CFBundleDisplayName: Cooldown
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Spike/Widget/CooldownWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.robinrichardrajan.cooldown]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.robinrichardrajan.cooldown.shared"]
  CooldownTests:
    # CCRM-94 (iOS App): tests that need the app's entitlements (Keychain shared group), hosted by the app.
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Cooldown
      - package: CooldownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrichardrajan.cooldown.tests
        GENERATE_INFOPLIST_FILE: YES
  CooldownUITests:
    # CCRM-94 (iOS App): demo-state screenshots in both orientations, and a launch smoke test.
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cooldown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrichardrajan.cooldown.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cooldown:
    build:
      targets:
        Cooldown: all
    test:
      targets:
        - CooldownTests
        - CooldownUITests
